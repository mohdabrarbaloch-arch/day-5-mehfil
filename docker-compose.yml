services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mehfil
      POSTGRES_PASSWORD: mehfil_dev_password
      POSTGRES_DB: mehfil
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mehfil -d mehfil"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://mehfil:mehfil_dev_password@db:5432/mehfil
      SECRET_KEY: ${SECRET_KEY:-change-me-before-you-deploy-this-anywhere}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LLM_BACKEND: ${LLM_BACKEND:-none}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
